<!doctype html>
<html><head><meta charset="utf-8"><title>RTL OG generator</title>
<style>
@font-face { font-family: "Press Start 2P"; src: url("../public/fonts/pressstart2p.woff2") format("woff2"); }
</style>
</head>
<body>
<canvas id="c" width="1200" height="630"></canvas>
<script>
/* Ricksy Taxi League — OG image generator. Open in a browser, click to save.
   1200x630 JPEG under 200KB for WhatsApp. All drawing procedural. */
const c = document.getElementById("c"), g = c.getContext("2d");

function px(x, y, w, h, col) { g.fillStyle = col; g.fillRect(x, y, w, h); }

/* ---- sky: warm Mzansi afternoon gradient ---- */
const sky = g.createLinearGradient(0, 0, 0, 630);
sky.addColorStop(0, "#1a1433"); sky.addColorStop(0.55, "#33194d"); sky.addColorStop(1, "#59247a");
g.fillStyle = sky; g.fillRect(0, 0, 1200, 630);

/* ---- sun ---- */
g.fillStyle = "#ffd60a";
g.beginPath(); g.arc(950, 150, 70, 0, 7); g.fill();
g.fillStyle = "#ff9f1c";
g.beginPath(); g.arc(950, 150, 52, 0, 7); g.fill();

/* ---- skyline silhouette + window dots ---- */
function skyline(baseY, hMax, col, seedShift, windows) {
  for (let i = -1; i < 10; i++) {
    const bw = 70 + ((i * 53 + seedShift * 17) % 60);
    const bh = 60 + ((i * 71 + seedShift * 31) % hMax);
    const bx = i * 140 + seedShift * 20, by = baseY - bh;
    px(bx, by, bw, bh, col);
    if (windows) {
      for (let w = 0; w < 4; w++) {
        const wx = bx + 8 + ((i * 13 + w * 17) % Math.max(8, bw - 12));
        const wy = by + 10 + ((i * 29 + w * 23) % Math.max(8, bh - 20));
        px(wx, wy, 4, 5, "rgba(245,197,66,.55)");
      }
    }
  }
}
skyline(430, 120, "#241539", 1, false);
skyline(450, 150, "#1a0f2b", 3, true);

/* ---- pitch (iso diamond) ---- */
function isoPt(x, y) { return [600 + (x - y) * 11, 480 + (x + y) * 5.5]; }
/* grass diamond */
g.fillStyle = "#2f8f3f";
g.beginPath();
g.moveTo(...isoPt(0, 0));
g.lineTo(...isoPt(30, 0)); g.lineTo(...isoPt(30, 34));
g.lineTo(...isoPt(0, 34)); g.closePath(); g.fill();
/* mow stripes */
for (let i = 0; i < 15; i++) {
  if (i % 2) continue;
  g.fillStyle = "#2a8238";
  const x0 = i * 2, x1 = i * 2 + 2;
  g.beginPath();
  g.moveTo(...isoPt(x0, 0)); g.lineTo(...isoPt(x1, 0));
  g.lineTo(...isoPt(x1, 34)); g.lineTo(...isoPt(x0, 34));
  g.closePath(); g.fill();
}
/* white touchline */
g.strokeStyle = "#e8f4e0"; g.lineWidth = 4;
g.beginPath();
g.moveTo(...isoPt(1, 1)); g.lineTo(...isoPt(29, 1));
g.lineTo(...isoPt(29, 33)); g.lineTo(...isoPt(1, 33));
g.closePath(); g.stroke();
/* centre line + circle */
g.beginPath(); g.moveTo(...isoPt(1, 17)); g.lineTo(...isoPt(29, 17)); g.stroke();
g.beginPath(); g.ellipse(...isoPt(15, 17), 66, 33, 0, 0, 7); g.stroke();

/* ---- goal (orange end, right) ---- */
function drawGoal(cx, cy, col) {
  /* net */
  g.strokeStyle = "rgba(240,240,240,.75)"; g.lineWidth = 2;
  const [gx, gy] = isoPt(cx, cy);
  for (let i = 0; i <= 6; i++) {
    g.beginPath(); g.moveTo(gx - 60 + i * 20, gy - 90); g.lineTo(gx - 60 + i * 20, gy); g.stroke();
  }
  for (let i = 0; i <= 5; i++) {
    g.beginPath(); g.moveTo(gx - 60, gy - 90 + i * 18); g.lineTo(gx + 60, gy - 90 + i * 18); g.stroke();
  }
  /* posts */
  g.fillStyle = "#f0f0e8";
  px(gx - 66, gy - 96, 8, 96, "#f0f0e8");
  px(gx + 58, gy - 96, 8, 96, "#f0f0e8");
  px(gx - 66, gy - 100, 132, 10, "#f0f0e8");
}
drawGoal(26, 8, "#ff8a2a");

/* ---- taxi (chunky pixel minibus, blue) ---- */
function drawTaxi(sx, sy, body, roof, flip) {
  g.save();
  if (flip) { g.translate(sx + 60, sy); g.scale(-1, 1); }
  else g.translate(sx, sy);
  /* shadow */
  g.fillStyle = "rgba(0,0,0,.35)";
  g.beginPath(); g.ellipse(30, 78, 40, 10, 0, 0, 7); g.fill();
  /* body */
  px(4, 34, 54, 30, body);          // main box
  px(4, 28, 40, 8, body);           // bonnet step
  px(10, 12, 40, 18, roof);         // roof band
  px(14, 16, 10, 10, "#1a2a3a");    // windshield
  px(28, 16, 9, 10, "#1a2a3a");     // window
  px(42, 16, 9, 10, "#1a2a3a");     // window
  /* stripe */
  px(4, 52, 54, 6, "#ffd60a");
  /* wheels */
  px(8, 62, 12, 14, "#20242c"); px(42, 62, 12, 14, "#20242c");
  px(10, 64, 8, 10, "#cfd6e0"); px(44, 64, 8, 10, "#cfd6e0");
  /* roof decal text pixels (abstract) */
  px(18, 6, 22, 5, "#fff7ff");
  px(18, 4, 5, 3, "#ff8a2a"); px(26, 4, 5, 3, "#3aa0ff");
  g.restore();
}
drawTaxi(180, 360, "#2f7fe0", "#8fd0ff", false);

/* ---- ball ---- */
function drawBall(sx, sy, r) {
  g.fillStyle = "rgba(0,0,0,.4)";
  g.beginPath(); g.ellipse(sx, sy + r * 0.9, r * 0.9, r * 0.32, 0, 0, 7); g.fill();
  g.fillStyle = "#f2ede2";
  g.beginPath(); g.arc(sx, sy, r, 0, 7); g.fill();
  /* pentagon patches */
  g.fillStyle = "#20242c";
  g.beginPath(); g.arc(sx, sy, r * 0.38, 0, 7); g.fill();
  for (let i = 0; i < 5; i++) {
    const a = i * (Math.PI * 2 / 5) - 0.4;
    g.beginPath(); g.arc(sx + Math.cos(a) * r * 0.72, sy + Math.sin(a) * r * 0.72, r * 0.22, 0, 7); g.fill();
  }
  g.fillStyle = "rgba(255,255,255,.5)";
  g.beginPath(); g.arc(sx - r * 0.35, sy - r * 0.4, r * 0.22, 0, 7); g.fill();
}
drawBall(560, 430, 46);

/* ---- orange taxi flying (banger moment) ---- */
drawTaxi(760, 320, "#f07818", "#ffd090", true);

/* ---- speed lines ---- */
g.strokeStyle = "rgba(255,255,255,.35)"; g.lineWidth = 4;
for (let i = 0; i < 5; i++) {
  g.beginPath(); g.moveTo(700, 340 + i * 22); g.lineTo(740 + i * 8, 340 + i * 22); g.stroke();
}

/* ---- confetti ---- */
const conf = ["#ff3d8b", "#ffd60a", "#2ee66b", "#00e5ff", "#ff9f1c"];
for (let i = 0; i < 60; i++) {
  const cx = (i * 197) % 1200, cy = (i * 113) % 380;
  px(cx, cy, 6, 6, conf[i % conf.length]);
}

/* ---- title ---- */
function titleText(str, x, y, size, col, shadow) {
  g.font = size + 'px "Press Start 2P", monospace';
  g.textAlign = "center"; g.textBaseline = "top";
  g.fillStyle = shadow; g.fillText(str, x + 5, y + 5);
  g.fillStyle = col; g.fillText(str, x, y);
}
/* scanline overlay for retro feel */
g.fillStyle = "rgba(0,0,0,.12)";
for (let y = 0; y < 630; y += 4) px(0, y, 1200, 1, "rgba(0,0,0,.12)");

titleText("RICKSY TAXI LEAGUE", 600, 60, 44, "#ffd60a", "#000000");
titleText("KASI CAR SOCCER", 600, 122, 18, "#ffffff", "#000000");
titleText("FREE - NO INSTALL - MZANSI STYLE", 600, 30, 13, "#e8f4e0", "#000000");

/* ---- export helpers ---- */
document.addEventListener("keydown", (e) => {
  if (e.key === "s") {
    const a = document.createElement("a");
    a.download = "og-image.jpg";
    a.href = c.toDataURL("image/jpeg", 0.82);
    a.click();
  }
});
document.addEventListener("click", () => {
  const a = document.createElement("a");
  a.download = "og-image.jpg";
  a.href = c.toDataURL("image/jpeg", 0.82);
  a.click();
});
</script>
</body></html>
